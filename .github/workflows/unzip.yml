name: Unzip upload
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract code and clean up
        run: |
          set -e
          test -f aavya-storefront-upload_2.zip || { echo "zip not found"; exit 0; }
          unzip -o aavya-storefront-upload_2.zip -d .
          git rm -q --ignore-unmatch aavya-storefront.zip aavya-storefront-upload_2.zip
          git rm -q .github/workflows/unzip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract storefront source from uploaded zip"
          git push
